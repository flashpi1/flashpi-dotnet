name: Release

# release-please keeps a release PR open with the next version and its CHANGELOG, built from the
# Conventional Commits merged into main. Merging that PR is the approval: it tags the version,
# creates the GitHub release and publishes the package to NuGet here.
#
# release-please works with a token of the organization's GitHub App (the organization variable
# FLASHPI_BOT_CLIENT_ID and secret FLASHPI_BOT_PRIVATE_KEY). A pull request opened with
# GITHUB_TOKEN gets its CI only after someone approves it, and checks from dispatched runs do not
# count for the required ones; one opened with the App's token runs CI like any other.
#
# NuGet trusted publishing (OIDC): no NuGet API key is stored anywhere. nuget.org trusts this
# workflow file of flashpi1/flashpi-dotnet in the `nuget` environment and hands the publish job a
# key that lives for one hour. The build job builds and checks the package without any secret;
# the publish job, the only one with `id-token: write`, only uploads it.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  # The .NET SDK that builds releases (a 10.0 SDK released at least two weeks earlier).
  RELEASE_SDK: '10.0.404'

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-24.04
    # release-please uses the App's token, not GITHUB_TOKEN.
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      pr: ${{ steps.release.outputs.pr }}
    steps:
      # A one-hour token for this repository only, with just what release-please needs: push the
      # release branch, tag and release (contents), open the PR (pull requests) and label it
      # (issues). It is revoked when the job ends.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.FLASHPI_BOT_CLIENT_ID }}
          private-key: ${{ secrets.FLASHPI_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # CI runs on the release PR by itself. The live API test spends the demo issuer's daily quota,
  # so it only runs on demand: start it on the release branch whenever release-please updates it.
  live-test:
    name: Live test on the release PR
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.pr != ''
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
    steps:
      - run: gh workflow run live.yml --ref "$BRANCH"

  # Building runs code fetched from NuGet (the System.Text.Json source generator, for the
  # netstandard2.0 build) and of this repository, so it runs here, with a read-only token and no
  # access to NuGet. The publish job only uploads what this job built and checked.
  build:
    name: Build the release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # No cache in a release build: nothing restored from a cache may reach the release. The SDK
      # is pinned by version, here and in global.json, so a newer SDK of the runner image is never
      # used (see CONTRIBUTING.md to update it); the packages, by Directory.Packages.props.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: ${{ env.RELEASE_SDK }}
      - name: Use exactly that SDK
        run: |
          jq --arg sdk "$RELEASE_SDK" '.sdk.version = $sdk | .sdk.rollForward = "disable"' global.json > global.json.tmp
          mv global.json.tmp global.json
          test "$(dotnet --version)" = "$RELEASE_SDK"
      - name: Pack the package and its symbols
        run: dotnet pack src/Flashpi -c Release -o dist
      - name: Check them against the tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: dotnet run --project tools/Flashpi.Tools -- package check dist "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: |
            dist/*.nupkg
            dist/*.snupkg
          if-no-files-found: error
          # The publish job waits for the nuget environment's approval, for up to 30 days.
          retention-days: 30

  # The only job that can get a NuGet key (trusted publishing through the `nuget` environment).
  # It checks out nothing, installs nothing and runs no code of this repository or of its
  # dependencies: it downloads the files the build job checked and pushes them with the dotnet
  # CLI of the runner image.
  publish:
    name: Publish to NuGet
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Flashpi/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      # A key that lives for one hour, for the nuget.org account `flashpi` (its trusted
      # publishing policy names this repository, release.yml and the nuget environment).
      - id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: flashpi
      - name: Publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        # The .snupkg next to the .nupkg goes to the symbol server too.
        run: dotnet nuget push dist/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
